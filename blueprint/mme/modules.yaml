#模块定义蓝图
---
#------模块蓝图 
# 模块是游戏中的一个独立对象单元，可以包含多个机制
# 自动生成proto文件时会生成模块的proto文件，文件名称为modules.proto，文件内容为模块的定义。
# 模块的定义和proto文件的定义是一一对应的，例如：HeroModule模块的定义和HeroModule.proto文件的定义是一一对应的。
# 模块的定义和.go文件的定义是一一对应的，例如：HeroModule模块的定义和HeroModule.go文件的定义是一一对应的。
# 例如：mechanisms.HeroMechanism Base: 1，HeroMechanism机制的定义和Base字段，Field序号为1
Modules:
  #英雄模块
  - HeroModule:
      #基本数据
      - HeroMechanism Base: 1
        Settings:
          activeSync: true
      #英雄升级
      - LevelUpMechanism LevelUp: 2
        Settings:
          readOnly: true
          AutoLevelUp: true
      #天赋解锁
      - ManualUnlockMechanism TalentUnlock: 3
      #时装穿戴
      - WearMechanism SkinWear: 4
