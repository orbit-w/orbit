#核心网络消息墙
---
NetWall:
  Name: Core
  Requests:
    - SearchBook:
        #位置
        string Query: 1
        #要第几页
        int32 PageNumber: 2
      Rsp:
        Book Result: 1
    - HeartBeat
    - RequestB:
    
  Notifies:
    - BeAttacked:
        int32 CurHp: 1
---
#数据结构,Core中定义的数据结构可以在其他墙中使用例如Core.OK
DataStructs:
  - Book:
      string Content: 1
  ##通用成功
  - OK
  ##通用失败
  - Error:
      string Reason: 1
  ##MME位置
  - MMELocation:
      int64 EntityId: 1
      int32 ModuleId: 2
      int32 MechanismIndex: 3