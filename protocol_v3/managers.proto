syntax = "proto3";

import "Modules.proto";

package MME;

message HeroManager {
    map<int32, HeroModule> HeroMap = 1;
    repeated HeroMap_XXXMapChangeRecord HeroMap_XXXChangeList = 1001;  message HeroMap_XXXMapChangeRecord { int32 key = 1; HeroModule value = 2; bool isDelete = 3; }

}


