syntax = "proto3";

import "Common.proto";
import "Mechanisms.proto";

package MME;

// 英雄模块
message HeroModule {
    // 基本数据
    optional HeroMechanism Base = 1;
    // 英雄升级
    optional LevelUpMechanism LevelUp = 2;
    // 天赋解锁
    optional ManualUnlockMechanism TalentUnlock = 3;
    // 时装穿戴
    optional WearMechanism SkinWear = 4;
}


