#用户数据蓝图
---
#------通用字段，各层级类默认继承的字段和它的默认值
#实体通用字段（Entity层级）
- EntityFields:

#组件通用字段（Component层级）
- ComponentFields:
  #是否包含在登陆时的全量数据请求中
  includeInLoginData: false

#机制通用字段（Mechanism层级）
- MechanismFields:
  #是否前端只读，只读机制不能被前端修改
  readOnly: false
  #是否为主动同步机制，如果是则后端会主动同步数据到客户端，否则需要客户端主动请求数据
  activeSync: false

---
#------类类型枚举定义
TypeEnum:
  - Mechanism # 机制（包含数据）
  - Component # 组件，机制的集合体
  - Entity    # 实体，模型的集合体

---
#------模块蓝图 
#英雄模块
Component:
  - Name: ComponentHero
    Mechanisms:
      - Name: HeroMechanism
        Settings: # 可以为特定Component中的Mechanism设置不同的属性
          readOnly: false
          activeSync: true
      - Name: LevelUpMechanism
        Settings:
          readOnly: true
          AutoLevelUp: true

---
#------机制蓝图
#升级机制
Mechanism:
  - Name: LevelUpMechanism
    NameSpace: MMCStructs
    Fields:
      - Level:
          Type: int32
          Tag: 1
          Comment: 当前等级
      - Exp:
          Type: int64
          Tag: 2
          Comment: 当前经验值
      - MaxExp:
          Type: int64
          Tag: 3
          Comment: 升到下一级所需的经验值
    Setting: #需要的设置
      #经验够则自动升级
      AutoLevelUp: bool
  #英雄机制
  - Name: HeroMechanism
    NameSpace: MMCStructs
    Fields:
      - Id:
          Type: int64
          Tag: 1
          Comment: 英雄唯一ID
      - ConfId:
          Type: int32
          Tag: 2
          Comment: 英雄配置ID
    