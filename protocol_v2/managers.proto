syntax = "proto3";

import "protocol/modules.proto";

option go_package = "./mme";

package MME;

message HeroManager {
    map<int64, MME.HeroModule> HeroMap = 1;
    repeated HeroMap_XXXMapChangeRecord HeroMap_XXXChangeList = 1001;  message HeroMap_XXXMapChangeRecord { int64 Key = 1; MME.HeroModule Value = 2; bool IsDelete = 3; }
}