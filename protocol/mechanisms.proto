syntax = "proto3";

package mechanisms;
option go_package = "mme";

// 升级机制
message LevelUpMechanism {
  int32 CurLevel = 1;  // 当前等级
  int32 CurExp = 2;    // 当前经验值
  int32 ConfId = 3;    // 走哪套升级配置
}

// 升级机制设置
message LevelUpMechanismSettings {
  bool AutoLevelUp = 1;  // 经验够则自动升级
}

// 英雄机制
message HeroMechanism {
  int64 Id = 1;         // 英雄实例唯一Id
  int32 ConfId = 2;     // 英雄配置ID
  int64 CreateTime = 3; // 玩家获得英雄的时间
  int32 UseTimes = 4;   // 英雄被使用次数
  map<int32, int32> Skills = 5; //
}

// 手动解锁机制
message ManualUnlockMechanism {
  map<int32, bool> UnlockMap = 1;  // 解锁状态
}

// 穿戴机制
message WearMechanism {
  map<int32, int32> WearMap = 1;  // 穿戴状态
  int32 ConfId = 2;               // 走哪套穿戴配置
}
