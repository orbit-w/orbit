syntax = "proto3";

package modules;
option go_package = "./mme";

import "protocol/mechanisms.proto";

message HeroModule {
    mechanisms.HeroMechanism Base = 1;
    mechanisms.LevelUpMechanism LevelUp = 2;
    mechanisms.ManualUnlockMechanism TalentUnlock = 3;
    mechanisms.WearMechanism SkinWear = 4;
}