syntax = "proto3";

package MME;
option go_package = "./mme";


import "core";

message Request {

    message AskLevelUp {
        optional int32 UpNum = 1;
        Core.MMELocation Loc = 1000;
        message Rsp {
            optional string Result = 1;
        }
    }

}

message Notify {

    message ExpChange {
        optional int32 Exp = 1;
        Core.MMELocation Loc = 1000;
    }

}

