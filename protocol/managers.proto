syntax = "proto3";

import "protocol/modules.proto";

option go_package = "./mme";

package managers;

message HeroManager {
    map<int64, modules.HeroModule> HeroMap = 1;
    repeated HeroMap_XXXMapChangeRecord HeroMap_XXXChangeList = 1001;  message HeroMap_XXXMapChangeRecord { int64 key = 1; modules.HeroModule value = 2; bool isDelete = 3; }
}