# 配置中心类型，支持: "nacos"
Type = "nacos"

# Nacos 配置中心连接配置
[nacos]
server_hosts = ["mse-63a694613-p.nacos-ans.mse.aliyuncs.com"]  # Nacos 服务器地址列表
namespace_id = "85a5d5cf-a969-4d61-841d-7a3829f0f28c"          # 命名空间ID
username = ""                                                    # 用户名（可选）
password = ""                                                    # 密码（可选）
timeout_ms = 5000                                                # 超时时间（毫秒）

# 配置源列表 - 可以配置多个 DataId/Group
[[sources]]
data_id = "game.main"
group = "server"
format = "yaml"

[[sources]]
data_id = "game.main"
group = "redis"
format = "yaml"

[[sources]]
data_id = "game.main"
group = "mongodb"
format = "yaml"